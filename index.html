<script>

/* =========================================================
   PÁDEL INFANTIL JEMENUÑO V1.7
   LIMPIEZA ÚNICA DE RESULTADOS ANTIGUOS DEL TORNEO
   ========================================================= */

const KEY="padelJemenuno2026";

/* ---------------------------------------------------------
   DATOS DE LAS PRUEBAS
   --------------------------------------------------------- */

const skillDefs=[

 {
  key:"toques",
  name:"Toques",
  max:5
 },

 {
  key:"pared",
  name:"Juego con pared",
  max:6
 },

 {
  key:"coloca",
  name:"Colocamos la bola",
  max:7.5
 },

 {
  key:"globo",
  name:"Despejamos con globo",
  max:7.5
 },

 {
  key:"red",
  name:"Peloteamos en la red",
  max:10
 }

];


/* ---------------------------------------------------------
   CARGA DE DATOS EXISTENTES
   --------------------------------------------------------- */

let state=
 JSON.parse(
  localStorage.getItem(KEY)||"null"
 )
 ||
 {
  participants:[],
  matches:{},
  semis:{},
  final:null
 };


/* ---------------------------------------------------------
   V1.7
   BORRAR SOLO LOS RESULTADOS DEL TORNEO ANTIGUO
   ---------------------------------------------------------

   IMPORTANTE:
   NO borra participantes.
   NO borra nombres.
   NO borra parejas.
   NO borra habilidades.

   Solo elimina:
   - partidos
   - semifinales
   - final

   La operación se ejecuta UNA SOLA VEZ.
   --------------------------------------------------------- */

const V17_RESET_KEY="padelJemenuno2026_v17_reset";

if(
 !localStorage.getItem(V17_RESET_KEY)
){

 state.matches={};
 state.semis={};
 state.final=null;

 localStorage.setItem(
  KEY,
  JSON.stringify(state)
 );

 localStorage.setItem(
  V17_RESET_KEY,
  "done"
 );

}


/* ---------------------------------------------------------
   GUARDAR
   --------------------------------------------------------- */

function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(state)
 );

}


/* ---------------------------------------------------------
   ESCAPAR HTML
   --------------------------------------------------------- */

function esc(s){

 return String(s??"")
 .replace(
  /[&<>"']/g,
  m=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"

  }[m])
 );

}


/* ---------------------------------------------------------
   PAREJAS
   --------------------------------------------------------- */

function pairs(){

 return [
  ...new Set(
   state.participants
   .map(x=>+x.pair)
   .filter(x=>x>0)
  )
 ]
 .sort(
  (a,b)=>a-b
 );

}


function participantsOfPair(pair){

 return state.participants.filter(
  x=>+x.pair===+pair
 );

}


function pairNames(pair){

 const members=
  participantsOfPair(pair);

 if(!members.length){
  return "Pareja "+pair;
 }

 return members
 .map(
  p=>esc(p.name)||"Sin nombre"
 )
 .join(" · ");

}


function pairLabel(pair){

 return `
 <div class="team-name">
 ${pairNames(pair)}
 </div>

 <div class="small">
 Pareja ${pair}
 </div>
 `;

}


/* ---------------------------------------------------------
   PARTICIPANTES
   --------------------------------------------------------- */

function addParticipant(){

 if(state.participants.length>=16){

  alert("Máximo 16 participantes.");

  return;

 }

 state.participants.push({

  id:Date.now(),

  name:"",

  pair:
   Math.min(
    8,
    state.participants.length+1
   ),

  skills:{
   toques:0,
   pared:0,
   coloca:0,
   globo:0,
   red:0
  }

 });

 save();
 renderAll();

}


function updateParticipant(
 id,
 field,
 val
){

 const p=
  state.participants.find(
   x=>x.id===id
  );

 if(!p)return;

 p[field]=
  field==="pair"
  ?+val
  :val;

 save();
 renderAll();

}


function removeParticipant(id){

 state.participants=
 state.participants.filter(
  x=>x.id!==id
 );

 save();
 renderAll();

}


function renderParticipants(){

 if(!state.participants.length){

  document.getElementById(
   "participantsTable"
  ).innerHTML=
  '<div class="empty">Añade participantes para empezar.</div>';

  return;

 }

 const rows=
 state.participants
 .map(
  (p,i)=>`

<tr>

<td>${i+1}</td>

<td>

<input
value="${esc(p.name)}"
placeholder="Nombre"
onchange="
updateParticipant(
 ${p.id},
 'name',
 this.value
)
">

</td>

<td>

<select
onchange="
updateParticipant(
 ${p.id},
 'pair',
 this.value
)
">

${
 Array.from(
  {length:8},
  (_,i)=>`

<option
value="${i+1}"
${+p.pair===i+1?"selected":""}
>
Pareja ${i+1}
</option>

`
 )
 .join("")
}

</select>

</td>

<td>

<button
class="btn red"
onclick="removeParticipant(${p.id})">
×
</button>

</td>

</tr>

`
 )
 .join("");


 document.getElementById(
  "participantsTable"
 ).innerHTML=

`
<table>

<thead>

<tr>
<th>#</th>
<th>Nombre</th>
<th>Pareja</th>
<th></th>
</tr>

</thead>

<tbody>
${rows}
</tbody>

</table>
`;

}


/* ---------------------------------------------------------
   HABILIDADES
   --------------------------------------------------------- */

function updateSkill(
 id,
 key,
 val
){

 const p=
  state.participants.find(
   x=>x.id===id
  );

 if(!p)return;

 const def=
  skillDefs.find(
   x=>x.key===key
  );

 let number=
  parseFloat(val)||0;

 number=
  Math.max(
   0,
   Math.min(
    def.max,
    number
   )
  );

 p.skills[key]=number;

 save();
 renderAll();

}


function skillTotal(p){

 return skillDefs
 .filter(
  x=>x.key!=="red"
 )
 .reduce(
  (total,x)=>
   total+
   (+p.skills[x.key]||0),
  0
 );

}


function pairSkill(pair){

 return participantsOfPair(pair)
 .reduce(
  (total,p)=>
   Math.max(
    total,
    +p.skills.red||0
   ),
  0
 );

}


function renderSkills(){

 if(!state.participants.length){

  document.getElementById(
   "skillsTable"
  ).innerHTML=
  '<div class="empty">Primero añade participantes.</div>';

  return;

 }

 const head=
 skillDefs
 .map(
  s=>`

<th>
${s.name}
<br>
<span class="small">
Máx. ${s.max}
</span>
</th>

`
 )
 .join("");


 const rows=
 state.participants
 .map(
  p=>`

<tr>

<td>

<strong>
${esc(p.name)||"Sin nombre"}
</strong>

<br>

<span class="small">
Pareja ${p.pair}
</span>

</td>

${
 skillDefs
 .map(
  s=>`

<td class="num">

<input
class="score-input"
type="number"
min="0"
max="${s.max}"
step="0.5"
value="${p.skills[s.key]||0}"
onchange="
updateSkill(
 ${p.id},
 '${s.key}',
 this.value
)
">

</td>

`
 )
 .join("")
}

<td class="total">
${skillTotal(p).toFixed(1)}
</td>

</tr>

`
 )
 .join("");


 document.getElementById(
  "skillsTable"
 ).innerHTML=

`
<table>

<thead>

<tr>

<th>Participante</th>

${head}

<th>Total individual</th>

</tr>

</thead>

<tbody>
${rows}
</tbody>

</table>

<p class="hint">

Las cuatro primeras pruebas son individuales.
"Peloteamos en la red" es una prueba de pareja
y cuenta una sola vez.

</p>
`;

}


/* ---------------------------------------------------------
   PARTIDOS
   --------------------------------------------------------- */

function groupPairs(group){

 return pairs().filter(
  p=>
   group==="A"
   ?p<=4
   :p>=5
 );

}


function matchKey(a,b){

 return [
  Math.min(a,b),
  Math.max(a,b)
 ].join("-");

}


function getMatch(a,b){

 const key=
  matchKey(a,b);

 const old=
  state.matches[key];

 if(!old)return null;

 if(typeof old==="number"){

  return {

   winner:old,

   aGames:
    old===a
    ?2
    :0,

   bGames:
    old===b
    ?2
    :0,

   tieBreak:null

  };

 }

 return old;

}


/* ---------------------------------------------------------
   RESULTADO PARTIDO
   --------------------------------------------------------- */

function setMatch(
 a,
 b,
 result
){

 const key=
  matchKey(a,b);

 result=
  String(result||"").trim();


 if(!result){

  delete state.matches[key];

  save();
  renderAll();

  return;

 }


 if(
  !/^(2-0|2-1|0-2|1-2)$/.test(result)
 ){

  alert(
   "Resultado no válido. Utiliza 2-0, 2-1, 0-2 o 1-2."
  );

  return;

 }


 const parts=
  result.split("-").map(Number);

 const scoreA=parts[0];
 const scoreB=parts[1];


 state.matches[key]={

  winner:
   scoreA>scoreB
   ?a
   :b,

  aGames:scoreA,
  bGames:scoreB,

  tieBreak:null

 };


 save();
 renderAll();

}


/* ---------------------------------------------------------
   TIE-BREAK
   --------------------------------------------------------- */

function setTieBreak(
 a,
 b,
 value
){

 const key=
  matchKey(a,b);

 const match=
  getMatch(a,b);

 if(!match)return;

 value=
  String(value||"").trim();


 if(!value){

  match.tieBreak=null;

  state.matches[key]=match;

  save();
  renderAll();

  return;

 }


 if(
  !/^[0-5]-[0-5]$/.test(value)
 ){

  alert(
   "Introduce el tie-break como 5-3, 5-4, 4-5, etc."
  );

  return;

 }


 const [
  tbA,
  tbB
 ]=
 value
 .split("-")
 .map(Number);


 if(
  tbA===tbB ||
  Math.max(tbA,tbB)!==5
 ){

  alert(
   "El tie-break es a 5 puntos y debe haber un ganador."
  );

  return;

 }


 const validTie=
  (
   match.aGames===2 &&
   match.bGames===1
  )
  ||
  (
   match.aGames===1 &&
   match.bGames===2
  );


 if(!validTie)return;


 match.tieBreak={

  a:tbA,
  b:tbB

 };


 state.matches[key]=match;

 save();
 renderAll();

}


/* ---------------------------------------------------------
   ESTADÍSTICAS GRUPO
   --------------------------------------------------------- */

function groupStats(
 pair,
 group
){

 let played=0;
 let wins=0;
 let losses=0;

 let gamesFor=0;
 let gamesAgainst=0;

 let tieFor=0;
 let tieAgainst=0;


 groupPairs(group)
 .forEach(
  opponent=>{

   if(opponent===pair)return;

   const match=
    getMatch(
     pair,
     opponent
    );

   if(!match)return;

   played++;

   if(+match.winner===pair){
    wins++;
   }else{
    losses++;
   }


   if(
    pair===Math.min(
     pair,
     opponent
    )
   ){

    gamesFor+=
     +match.aGames||0;

    gamesAgainst+=
     +match.bGames||0;

   }else{

    gamesFor+=
     +match.bGames||0;

    gamesAgainst+=
     +match.aGames||0;

   }


   if(
    (
     match.aGames===2 &&
     match.bGames===1
    )
    ||
    (
     match.aGames===1 &&
     match.bGames===2
    )
   ){

    if(match.tieBreak){

     if(
      pair===Math.min(
       pair,
       opponent
      )
     ){

      tieFor+=
       +match.tieBreak.a;

      tieAgainst+=
       +match.tieBreak.b;

     }else{

      tieFor+=
       +match.tieBreak.b;

      tieAgainst+=
       +match.tieBreak.a;

     }

    }

   }

  }
 );


 return {

  played,
  wins,
  losses,

  gamesFor,
  gamesAgainst,

  difference:
   gamesFor-gamesAgainst,

  tieFor,
  tieAgainst,

  tieDifference:
   tieFor-tieAgainst,

  points:
   wins*2+
   losses*1

 };

}


/* ---------------------------------------------------------
   CLASIFICACIÓN GRUPO
   --------------------------------------------------------- */

function groupStandings(group){

 return groupPairs(group)
 .map(
  pair=>({

   pair,

   ...groupStats(
    pair,
    group
   )

  })
 )
 .sort(
  (a,b)=>

   b.wins-a.wins ||

   b.difference-a.difference ||

   b.gamesFor-a.gamesFor ||

   b.tieDifference-a.tieDifference ||

   b.tieFor-a.tieFor ||

   a.pair-b.pair

 );

}


/* ---------------------------------------------------------
   RENDER PARTIDOS
   --------------------------------------------------------- */

function renderMatches(){

 const group=
  document.getElementById(
   "selectedGroup"
  ).value;


 const ps=
  groupPairs(group);


 let html="";


 for(
  let i=0;
  i<ps.length;
  i++
 ){

  for(
   let j=i+1;
   j<ps.length;
   j++
  ){

   const a=ps[i];
   const b=ps[j];

   const match=
    getMatch(a,b);

   let value="";

   if(match){

    value=
     `${match.aGames}-${match.bGames}`;

   }


   const needsTie=
    match &&
    (
     (
      match.aGames===2 &&
      match.bGames===1
     )
     ||
     (
      match.aGames===1 &&
      match.bGames===2
     )
    );


   html+=`

<div class="match">

${pairLabel(a)}

<div style="margin:5px 0">
vs
</div>

${pairLabel(b)}

<div style="margin-top:10px">

<label>
Resultado del partido
</label>

<select
onchange="
setMatch(
 ${a},
 ${b},
 this.value
)
">

<option value="">
Pendiente
</option>

<option
value="2-0"
${value==="2-0"?"selected":""}
>
2-0
</option>

<option
value="2-1"
${value==="2-1"?"selected":""}
>
2-1
</option>

<option
value="0-2"
${value==="0-2"?"selected":""}
>
0-2
</option>

<option
value="1-2"
${value==="1-2"?"selected":""}
>
1-2
</option>

</select>

</div>


${
 needsTie
 ?

`

<div class="tie-break">

<div class="tie-break-title">
⚡ Tie-break a 5 puntos
</div>

<label>
Resultado del tie-break
</label>

<select
onchange="
setTieBreak(
 ${a},
 ${b},
 this.value
)
">

<option value="">
Pendiente
</option>

<option value="5-0"
${
 match.tieBreak &&
 match.tieBreak.a===5 &&
 match.tieBreak.b===0
 ?"selected":""
}
>5-0</option>

<option value="5-1"
${
 match.tieBreak &&
 match.tieBreak.a===5 &&
 match.tieBreak.b===1
 ?"selected":""
}
>5-1</option>

<option value="5-2"
${
 match.tieBreak &&
 match.tieBreak.a===5 &&
 match.tieBreak.b===2
 ?"selected":""
}
>5-2</option>

<option value="5-3"
${
 match.tieBreak &&
 match.tieBreak.a===5 &&
 match.tieBreak.b===3
 ?"selected":""
}
>5-3</option>

<option value="5-4"
${
 match.tieBreak &&
 match.tieBreak.a===5 &&
 match.tieBreak.b===4
 ?"selected":""
}
>5-4</option>

<option value="4-5"
${
 match.tieBreak &&
 match.tieBreak.a===4 &&
 match.tieBreak.b===5
 ?"selected":""
}
>4-5</option>

<option value="3-5"
${
 match.tieBreak &&
 match.tieBreak.a===3 &&
 match.tieBreak.b===5
 ?"selected":""
}
>3-5</option>

<option value="2-5"
${
 match.tieBreak &&
 match.tieBreak.a===2 &&
 match.tieBreak.b===5
 ?"selected":""
}
>2-5</option>

<option value="1-5"
${
 match.tieBreak &&
 match.tieBreak.a===1 &&
 match.tieBreak.b===5
 ?"selected":""
}
>1-5</option>

<option value="0-5"
${
 match.tieBreak &&
 match.tieBreak.a===0 &&
 match.tieBreak.b===5
 ?"selected":""
}
>0-5</option>

</select>

${
 match.tieBreak
 ?
 `<div class="small" style="margin-top:5px">
 Diferencia tie-break:
 <strong>
 ${Math.abs(
   match.tieBreak.a-
   match.tieBreak.b
 )} puntos
 </strong>
 </div>`
 :
 ""
}

</div>

`

: ""

}

</div>

`;

  }

 }


 document.getElementById(
  "matches"
 ).innerHTML=

 html
 ?

 `<div class="match-grid">${html}</div>`

 :

 '<div class="empty">Necesitas tener parejas asignadas a este grupo.</div>';


 renderGroupRanking(group);

}


/* ---------------------------------------------------------
   CLASIFICACIÓN GRUPO
   --------------------------------------------------------- */

function renderGroupRanking(group){

 const ranking=
  groupStandings(group);


 if(!ranking.length){

  document.getElementById(
   "groupRanking"
  ).innerHTML="";

  return;

 }


 const rows=
 ranking
 .map(
  (r,index)=>`

<tr class="${
 index===0
 ?"rank1"
 :index===1
 ?"rank2"
 :index===2
 ?"rank3"
 :""
}">

<td class="position">
${index+1}
</td>

<td>
${pairLabel(r.pair)}
</td>

<td class="num">${r.played}</td>
<td class="num">${r.wins}</td>
<td class="num">${r.losses}</td>
<td class="num">${r.gamesFor}</td>
<td class="num">${r.gamesAgainst}</td>

<td class="num">
${r.difference>0?"+":""}${r.difference}
</td>

<td class="num">
${r.tieDifference>0?"+":""}${r.tieDifference}
</td>

<td class="num">
<strong>${r.points}</strong>
</td>

</tr>

`
 )
 .join("");


 document.getElementById(
  "groupRanking"
 ).innerHTML=

`

<div class="group-ranking">

<h3>
📊 Clasificación Grupo ${group}
</h3>

<table>

<thead>

<tr>

<th>#</th>
<th>Pareja</th>
<th>PJ</th>
<th>PG</th>
<th>PP</th>
<th>GF</th>
<th>GC</th>
<th>Dif.</th>
<th>TB Dif.</th>
<th>Puntos</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

<p class="hint">

<strong>Criterios:</strong>
partidos ganados → diferencia de juegos →
juegos a favor → diferencia del tie-break →
puntos de tie-break a favor.

</p>

</div>

`;

}


/* ---------------------------------------------------------
   PUNTOS DE GRUPO
   --------------------------------------------------------- */

function groupPoints(pair){

 let total=0;


 Object.entries(
  state.matches
 )
 .forEach(
  ([key,match])=>{

   const [
    a,
    b
   ]=
    key
    .split("-")
    .map(Number);


   if(
    a!==pair &&
    b!==pair
   ){

    return;

   }


   if(!match)return;


   const winner=
    typeof match==="number"
    ?match
    :match.winner;


   /*
    SOLO resultados reales.
    Si está pendiente no suma absolutamente nada.
   */

   if(
    winner===undefined ||
    winner===null ||
    winner===""
   ){

    return;

   }


   total+=
    +winner===pair
    ?2
    :1;

  }
 );


 return total;

}


/* ---------------------------------------------------------
   SEMIFINALES
   --------------------------------------------------------- */

function renderSemis(){

 const a=
  groupStandings("A");

 const b=
  groupStandings("B");


 if(
  a.length<2 ||
  b.length<2
 ){

  document.getElementById(
   "semis"
  ).innerHTML=
  '<div class="empty">Completa al menos los participantes de ambos grupos para generar las semifinales.</div>';

  return;

 }


 const pairings=[

  [
   a[0].pair,
   b[1].pair
  ],

  [
   b[0].pair,
   a[1].pair
  ]

 ];


 let html="";


 pairings.forEach(
  (m,index)=>{

   const key=
    matchKey(
     m[0],
     m[1]
    );

   const winner=
    state.semis[key]||"";


   html+=`

<div class="match">

<strong>
Semifinal ${index+1}
</strong>

<div style="margin-top:8px">

${pairLabel(m[0])}

<div style="margin:5px 0">
vs
</div>

${pairLabel(m[1])}

</div>

<select
style="margin-top:10px"
onchange="
state.semis['${key}']=
this.value
?+this.value
:null;

state.final=null;

save();

renderAll();
">

<option value="">
Pendiente
</option>

<option
value="${m[0]}"
${+winner===m[0]?"selected":""}
>
Gana · ${pairNames(m[0])} · 3 pt
</option>

<option
value="${m[1]}"
${+winner===m[1]?"selected":""}
>
Gana · ${pairNames(m[1])} · 3 pt
</option>

</select>

</div>

`;

  }
 );


 document.getElementById(
  "semis"
 ).innerHTML=

`
<div class="match-grid">
${html}
</div>
`;

}


function semiPoints(pair){

 let total=0;


 Object.entries(
  state.semis
 )
 .forEach(
  ([key,winner])=>{

   if(
    !winner
   ){

    return;

   }


   const [
    a,
    b
   ]=
    key
    .split("-")
    .map(Number);


   if(
    a===pair ||
    b===pair
   ){

    total+=
     +winner===pair
     ?3
     :1;

   }

  }
 );


 return total;

}


function semiWinners(){

 return Object
 .values(
  state.semis
 )
 .filter(Boolean)
 .map(Number);

}


/* ---------------------------------------------------------
   FINAL
   --------------------------------------------------------- */

function renderFinal(){

 const winners=
  semiWinners();


 if(
  winners.length<2
 ){

  document.getElementById(
   "final"
  ).innerHTML=
  '<div class="empty">Completa las dos semifinales para generar la final.</div>';

  return;

 }


 const a=winners[0];
 const b=winners[1];

 const winner=
  state.final||"";


 document.getElementById(
  "final"
 ).innerHTML=

`

<div class="match">

<strong>
🏆 Gran final
</strong>

<div style="margin-top:8px">

${pairLabel(a)}

<div style="margin:5px 0">
vs
</div>

${pairLabel(b)}

</div>

<select
style="margin-top:10px"
onchange="
state.final=
this.value
?+this.value
:null;

save();

/* ---------------------------------------------------------
   PUNTOS TORNEO
   --------------------------------------------------------- */

function tournamentPoints(pair){

 let total=
  groupPoints(pair);


 total+=
  semiPoints(pair);


 if(state.final){

  const winners=
   semiWinners();


  if(
   winners.includes(pair)
  ){

   total+=
    +state.final===pair
    ?6
    :2;

  }

 }


 return total;

}


/* ---------------------------------------------------------
   TOTAL PAREJA
   --------------------------------------------------------- */

function pairTotal(pair){

 const members=
  participantsOfPair(pair);


 const individual=
  members.reduce(
   (total,p)=>
    total+
    skillTotal(p),
   0
  );


 const pairTest=
  pairSkill(pair);


 const tournament=
  tournamentPoints(pair);


 return(
  individual+
  pairTest+
  tournament
 );

}


/* ---------------------------------------------------------
   CLASIFICACIÓN GENERAL
   --------------------------------------------------------- */

function renderRanking(){

 const ranking=
  pairs()
  .map(
   pair=>({

    pair,

    members:
     participantsOfPair(pair),

    individual:
     participantsOfPair(pair)
     .reduce(
      (total,p)=>
       total+
       skillTotal(p),
      0
     ),

    pairTest:
     pairSkill(pair),

    tournament:
     tournamentPoints(pair),

    total:
     pairTotal(pair)

   })
  )
  .sort(
   (a,b)=>
    b.total-a.total ||
    a.pair-b.pair
  );


 if(!ranking.length){

  document.getElementById(
   "ranking"
  ).innerHTML=
  '<div class="empty">Añade participantes para ver la clasificación.</div>';

  return;

 }


 const rows=
 ranking
 .map(
  (r,index)=>`

<tr class="${
 index===0
 ?"rank1"
 :index===1
 ?"rank2"
 :index===2
 ?"rank3"
 :""
}">

<td class="position">
<strong>${index+1}</strong>
</td>

<td>

<div class="team-name">

${
 r.members
 .map(
  p=>esc(p.name)||"Sin nombre"
 )
 .join(" · ")
}

</div>

<div class="small">
Pareja ${r.pair}
</div>

</td>

<td class="num">
${r.individual.toFixed(1)}
</td>

<td class="num">
${r.pairTest.toFixed(1)}
</td>

<td class="num">
${r.tournament}
</td>

<td class="num total">
${r.total.toFixed(1)}
</td>

</tr>

`
 )
 .join("");


 document.getElementById(
  "ranking"
 ).innerHTML=

`

<table>

<thead>

<tr>

<th>#</th>
<th>Pareja</th>
<th>Habilidades individuales</th>
<th>Prueba pareja</th>
<th>Torneo</th>
<th>TOTAL</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

`;

}


/* ---------------------------------------------------------

function renderAll(){

 renderParticipants();

 renderSkills();

 renderMatches();

 renderSemis();

 renderFinal();

 renderRanking();

}
